<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>PixelProMax Studio | Photo & Video Editing</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #0b0b0b;
  color: #fff;
  line-height: 1.5;
}

header {
  background: #111;
  border-bottom: 1px solid #333;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  color: #f5c542;
}

.logo span {
  color: #fff;
}

.nav a {
  color: #ddd;
  text-decoration: none;
  margin-left: 15px;
  font-size: 14px;
}

.hero {
  padding: 65px 20px;
  text-align: center;
  background: radial-gradient(circle at top, #252525 0, #0b0b0b 55%);
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #f5c542;
}

.hero p {
  max-width: 700px;
  margin: auto;
  color: #bbb;
  font-size: 17px;
}

.btn {
  display: inline-block;
  padding: 13px 22px;
  border: 0;
  border-radius: 8px;
  background: #f5c542;
  color: #111;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  margin-top: 22px;
}

.btn.dark {
  background: #222;
  color: #fff;
  border: 1px solid #444;
}

.btn.upload-btn {
  font-size: 16px;
  padding: 15px 25px;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 45px 20px;
}

.section-title {
  text-align: center;
  font-size: 30px;
  margin-bottom: 30px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 25px;
}

.card h3 {
  color: #f5c542;
  margin-bottom: 10px;
}

.card p {
  color: #aaa;
}

.editor {
  background: #111;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 20px;
}

.upload-area {
  border: 2px dashed #555;
  border-radius: 12px;
  padding: 30px 20px;
  text-align: center;
  margin-bottom: 20px;
  background: #0d0d0d;
}

.upload-area:hover {
  border-color: #f5c542;
}

.upload-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.upload-area h3 {
  margin-bottom: 8px;
}

.upload-area p {
  color: #777;
  margin-bottom: 5px;
}

.file-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.preview {
  min-height: 250px;
  background: #050505;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 20px;
  position: relative;
}

.preview img,
.preview video {
  max-width: 100%;
  max-height: 500px;
  display: none;
  object-fit: contain;
}

#placeholder {
  color: #777;
  text-align: center;
  padding: 40px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.control {
  background: #191919;
  padding: 15px;
  border-radius: 10px;
}

.control label {
  display: block;
  font-size: 13px;
  color: #aaa;
  margin-bottom: 7px;
}

input[type="range"] {
  width: 100%;
}

select,
input[type="text"],
input[type="number"],
input[type="tel"] {
  width: 100%;
  padding: 11px;
  border-radius: 7px;
  border: 1px solid #444;
  background: #0d0d0d;
  color: #fff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}

.actions .btn {
  margin-top: 0;
}

.pricing {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.price {
  font-size: 30px;
  font-weight: 800;
  margin: 15px 0;
  color: #f5c542;
}

.payment {
  max-width: 600px;
  margin: auto;
  background: #151515;
  padding: 25px;
  border-radius: 15px;
  border: 1px solid #333;
}

.payment label {
  display: block;
  margin: 15px 0 6px;
  color: #bbb;
}

.payment-note {
  background: #0e2618;
  border: 1px solid #246b3d;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  color: #b8e5c6;
}

footer {
  background: #111
